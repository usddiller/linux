<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор оценок</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2>Калькулятор оценок</h2>

    <div class="field">
      <label for="studentName">Имя и фамилия студента:</label>
      <input type="text" id="studentName" placeholder="Введите ФИО">
    </div>

    <form id="gradesForm">
      <div class="field">
        <label for="sub1">Операционные системы:</label>
        <input type="number" id="sub1" min="0" max="100" placeholder="0 - 100" required>
      </div>
      <div class="field">
        <label for="sub2">Компьютерные сети:</label>
        <input type="number" id="sub2" min="0" max="100" placeholder="0 - 100" required>
      </div>
      <div class="field">
        <label for="sub3">Базы данных:</label>
        <input type="number" id="sub3" min="0" max="100" placeholder="0 - 100" required>
      </div>
      <div class="field">
        <label for="sub4">Веб-разработка:</label>
        <input type="number" id="sub4" min="0" max="100" placeholder="0 - 100" required>
      </div>
      <div class="field">
        <label for="sub5">Алгоритмы и структуры данных:</label>
        <input type="number" id="sub5" min="0" max="100" placeholder="0 - 100" required>
      </div>

      <button type="button" id="calcBtn">Рассчитать</button>
    </form>

    <div id="resultBlock" class="result hidden"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
